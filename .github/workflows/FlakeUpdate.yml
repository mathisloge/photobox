name: Update flake.lock
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Update flake.lock
        run: nix flake update
      # PRs opened with GITHUB_TOKEN don't trigger PrValidation, so check here.
      - name: Build and test
        run: nix flake check -L
      - name: Evaluate aarch64 package
        run: nix eval .#packages.aarch64-linux.default.drvPath
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flake-lock
          commit-message: "build(deps): update flake.lock"
          title: "build(deps): update flake.lock"
          # email sets "github-actions[bot]" as commit author, see https://github.community/t/github-actions-bot-email-address/17204/6
          author: Flake Update <41898282+github-actions[bot]@users.noreply.github.com>
          committer: Flake Update <41898282+github-actions[bot]@users.noreply.github.com>
